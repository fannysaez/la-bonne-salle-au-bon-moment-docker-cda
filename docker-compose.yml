name: la-bonne-salle-au-bon-moment-docker

services:
  frontend:
    build: ./la-bonne-salle-au-bon-moment-frontend-cda
    ports:
      - "5173:5173"
    volumes:
      - ./la-bonne-salle-au-bon-moment-frontend-cda:/app
      - /app/node_modules

  backend:
    build: ./la-bonne-salle-au-bon-moment-backend-cda
    ports:
      - "3000:3000"
    volumes:
      - ./la-bonne-salle-au-bon-moment-backend-cda:/app
      - /app/node_modules
    env_file:
      - ./la-bonne-salle-au-bon-moment-backend-cda/.env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    external: true
    name: docker-react_mongo_data